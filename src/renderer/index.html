<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcripter</title>
  </head>
  <body>
    <main class="layout">
      <header>
        <h1>Transcripter Queue</h1>
      </header>

      <section id="drop-zone" class="drop-zone">
        <p>Drag and drop files here to add to the queue.</p>
      </section>

      <section class="panel">
        <h2>Queue</h2>
        <div class="controls">
          <button id="add-files" type="button">Add Files</button>
          <button id="remove-selected" type="button">Remove Selected</button>
          <button id="clear-completed" type="button">Clear Completed</button>
          <button id="start-queue" type="button">Start</button>
          <button id="cancel-current" type="button">Cancel Current</button>
          <button id="pause-queue" type="button" hidden>Pause</button>
          <button id="toggle-console" type="button">Show Console</button>
        </div>
        <ul id="queue-list"></ul>
      </section>

      <section id="console-panel" class="panel console-panel" hidden>
        <h2>Process Console</h2>
        <pre id="console-output" aria-live="polite"></pre>
      </section>

      <section class="panel settings">
        <h2>Settings</h2>
        <form id="settings-form">
          <label>
            Output directory
            <input id="output-directory" name="outputDirectory" type="text" />
          </label>
          <label>
            Language
            <input id="language" name="language" type="text" />
          </label>
          <label>
            Model
            <select id="model" name="model">
              <option value="tiny">tiny</option>
              <option value="base">base</option>
              <option value="small">small</option>
            </select>
          </label>
          <label>
            <input id="format-txt" name="txt" type="checkbox" />
            TXT output
          </label>
          <label>
            <input id="format-timecoded-txt" name="timecodedTxt" type="checkbox" />
            Timecoded TXT output
          </label>
          <label>
            <input id="format-srt" name="srt" type="checkbox" />
            SRT output
          </label>
          <label>
            <input id="format-vtt" name="vtt" type="checkbox" />
            VTT output
          </label>
          <label>
            <input id="format-json" name="json" type="checkbox" />
            JSON output
          </label>
          <button type="submit">Save settings</button>
        </form>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
